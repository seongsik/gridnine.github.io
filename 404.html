<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페이지 없음 · Gridnine</title>
  <style>
    :root { --bg: #ffffff; --fg: #111827; --muted: #6b7280; --accent: #6366f1; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0b0d12; --fg: #f3f4f6; --muted: #9ca3af; --accent: #818cf8; }
    }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      display: grid; place-items: center; padding: 16px; text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 3rem; }
    p { margin: 0 0 16px; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>요청하신 페이지를 찾을 수 없습니다.</p>
    <a href="/">홈으로</a>
  </main>
</body>
</html>
